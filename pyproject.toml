[project]
name = "travel-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sunub", email = "bsc5672@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2 ; sys_platform != 'darwin'",
    "datasets>=5.0.1",
    "peft>=0.21.0",
    "pyyaml>=6.0.3",
    "torch>=2.14.0",
    "transformers>=5.5",
    "trl>=1.14.0",
]

[project.scripts]
travel-planner = "travel_planner:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["training/tests"]
